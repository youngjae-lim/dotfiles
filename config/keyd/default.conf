# keyd: the M2's Karabiner keys on the Ubuntu spares (docs chapter 14).
# Copied to /etc/keyd/default.conf by home/.chezmoiscripts/
# run_onchange_after_16-keyd.sh.tmpl when this file changes (not a live link:
# keyd reads only /etc). Try a change by hand: sudo cp this file there, then
# sudo keyd reload. Stuck keyboard: press Backspace+Escape+Enter together to
# stop keyd.

[ids]
*

[main]
# Caps Lock: tap = Esc, hold = Ctrl (as on the M2).
capslock = overload(nav, esc)

# While Caps Lock is held it is Ctrl (the ":C"), except that h/j/k/l are the
# arrow keys. Caps+Shift+h/j/k/l selects, as Shift+arrow does.
[nav:C]
h = left
j = down
k = up
l = right
