# Single source of truth for AI agent policy. Rendered into:
#   ~/.claude/settings.json (+ hooks), ~/.gemini/settings.json,
#   ~/.gemini/policies/dotfiles.toml, ~/.copilot/mcp-config.json,
#   VS Code's mcp.json and the `copilot` wrapper in ~/.config/zsh/agents.zsh.
# After editing, run scripts/check.sh: it renders every agent's config and
# fails if any of them disagrees with this file.
# Policy: auto-edit files + run safe local commands; ask for network/destructive; never touch secrets.
agents:
  # Command prefixes agents may run without asking.
  allowCommands:
    - git status
    - git diff
    - git log
    - git show
    - git branch
    - git worktree list
    - git rev-parse
    - git ls-files
    - git blame
    - rg
    - fd
    - ls
    - tree
    - jq
    - go build
    - go test
    - go vet
    - go fmt
    - go mod tidy
    - mix test
    - mix format
    - gofmt
    - golangci-lint
    - npm test
    - npm run
    - pnpm test
    - pnpm run
    - bun test
    - bun run
    - php artisan test
    - vendor/bin/pest
    - vendor/bin/phpunit
    - vendor/bin/pint
    - vendor/bin/phpstan
    - composer test
    - pytest
    - uv run
    - ruff
    - mise ls
    - make test
    - make lint
    - chezmoi diff
    - chezmoi doctor
    - shellcheck
    - stylua
    - scripts/check.sh
    - ./scripts/check.sh
  # Always prompt, even if a broader rule would allow it.
  askCommands:
    - git push
    - git commit
    - git reset
    - git clean
    - git rebase
    - git checkout
    - rm
    - curl
    - wget
    - brew
    - npm install
    - pnpm add
    - composer require
    - chezmoi apply
  # Never allowed.
  denyCommands:
    - sudo
    - op
    - git push --force
    - git push -f
  # Files agents must never read or write (globs). Supported forms:
  #   **/<name>     that file name in any directory (may contain *)
  #   ~/<path>      one file under $HOME
  #   ~/<dir>/**    everything under a directory in $HOME
  # Claude, Gemini, Copilot rules and the Claude secret-guard hook are all
  # derived from this list.
  denyPaths:
    - "**/.env"
    - "**/.env.local"
    - "**/.env.*.local"
    - "**/.env.production"
    - "~/.ssh/**"
    - "~/.config/zsh/secrets.zsh"
    - "~/.config/op/**"

  # Copilot CLI matches by command name (+ first subcommand for git/go/npm/...),
  # not by prefix, so its rules are listed explicitly to avoid over-broad grants.
  # It already auto-runs commands it recognizes as read-only (git status, rg, ls...).
  copilot:
    allowTools:
      - write
      - shell(go build)
      - shell(go test)
      - shell(go vet)
      - shell(go fmt)
      - shell(gofmt)
      - shell(golangci-lint)
      - shell(npm test)
      - shell(npm run)
      - shell(pnpm test)
      - shell(pnpm run)
      - shell(bun test)
      - shell(bun run)
      - shell(composer test)
      - shell(vendor/bin/pest)
      - shell(./vendor/bin/pest)
      - shell(vendor/bin/pint)
      - shell(./vendor/bin/pint)
      - shell(pytest)
      - shell(uv run)
      - shell(ruff)
      - shell(mix test)
      - shell(mix format)
      - shell(shellcheck)
      - shell(stylua)
      - shell(scripts/check.sh)
      - shell(./scripts/check.sh)
    # Deny rules are generated from denyCommands (single-word ones) and
    # denyPaths; list Copilot-only extras here.
    denyTools: []

  # MCP servers shared by Claude Code, Copilot CLI, Gemini CLI and VS Code.
  # This list is authoritative: a server removed here is removed from every
  # agent on the next `chezmoi apply`. Two types:
  #   type: http   + url
  #   type: stdio  + command (+ args)
  # Never put secrets here (this repo is public).
  mcpServers:
    context7:
      type: http
      url: https://mcp.context7.com/mcp
    time:
      type: stdio
      command: uvx
      args: [mcp-server-time, --local-timezone=America/New_York]
