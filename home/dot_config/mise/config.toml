# Global runtimes (Herd provides PHP). Per-project versions go in mise.toml /
# .tool-versions / .nvmrc / .python-version.
[tools]
node = "24"
python = "3.13"
go = "1.26"

# --- Language tooling: servers, formatters, linters ---------------------------
# Used by Neovim (config/nvim), and on PATH for the shell and AI agents too.
# Rule: language tooling lives here; the Brewfile is for everything else.
# Projects' own versions (node_modules/.bin, vendor/bin) win where they exist.
# `mise upgrade` updates them; Neovim's :LspMissing shows what's absent.
"aqua:tree-sitter/tree-sitter" = "latest"          # builds syntax parsers (nvim-treesitter needs >= 0.26.1)
"go:golang.org/x/tools/gopls" = "latest"           # Go
"go:mvdan.cc/gofumpt" = "latest"                   # Go formatter
"aqua:golangci/golangci-lint" = "latest"           # Go linter
"npm:@vtsls/language-server" = "latest"            # JS/TS/React/Solid/TanStack
"npm:typescript" = "6"                             # TS 7 (native) has no API yet; Svelte/Astro tools need 6
# svelte@4.2.20 is a 4.x maintenance backport published after 5.0.0 without
# provenance, so mise's npm installer (aube) flags it as a "trust downgrade".
# Excluded for that exact version only; review again if the pin changes.
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = ["svelte@4.2.20"] }
"npm:@astrojs/language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"      # HTML, CSS, JSON, ESLint servers
"npm:@olrtg/emmet-language-server" = "latest"
"npm:intelephense" = "latest"                      # PHP / Laravel / Blade
"npm:yaml-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:bash-language-server" = "latest"
"npm:prettier" = "latest"                          # fallback when a project has none
"npm:blade-formatter" = "latest"
"npm:markdownlint-cli" = "latest"
"npm:stylelint" = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:tamasfe/taplo" = "latest"                    # TOML server + formatter
"aqua:artempyanykh/marksman" = "latest"            # Markdown notes
"aqua:hadolint/hadolint" = "latest"                # Dockerfile linter
"aqua:mvdan/sh" = "latest"                         # shfmt
"github:avencera/rustywind" = "latest"             # Tailwind class sorting (Blade); not in aqua

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "go"]
experimental = false

# Copilot suggestions in Neovim. The per-platform builds of copilot-sdk 1.0.28
# lack the "trusted publisher" record older releases had, but npm shows all
# eight published by the same GitHub Actions OIDC account (checked 2026-11-18).
# Exempt exactly these versions; a newer pin will fail again and should be
# re-checked the same way (see docs/11-neovim.md, "When it breaks").
[tools."npm:@github/copilot-language-server"]
version = "latest"
trust_policy_excludes = [
  "@github/copilot-sdk-darwin-arm64@1.0.28",
  "@github/copilot-sdk-darwin-x64@1.0.28",
  "@github/copilot-sdk-linux-arm64@1.0.28",
  "@github/copilot-sdk-linux-x64@1.0.28",
  "@github/copilot-sdk-linuxmusl-arm64@1.0.28",
  "@github/copilot-sdk-linuxmusl-x64@1.0.28",
  "@github/copilot-sdk-win32-arm64@1.0.28",
  "@github/copilot-sdk-win32-x64@1.0.28",
]
