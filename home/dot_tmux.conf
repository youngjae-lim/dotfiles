# Fallback multiplexer (herdr is the default). Managed by chezmoi.
unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Change prefix key from 'C-b' to 'C-f'
set -g prefix C-f

set -g history-file ""
set -g history-limit 50000

set -s escape-time 0

set -g mouse on

# Agent-friendly: pass Shift+Enter etc. through, reload files on focus, alert on bell.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
set -g monitor-bell on
set -g allow-passthrough on

# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'wave'
# set -g @kanagawa-ignore-window-colors true

# kangaawa options
set -g @kanagawa-network-bandwidth-show-interface false
set -g @kanagawa-day-month true
set -g @kanagawa-show-fahrenheit false
set -g @kanagawa-fixed-location 'New York, NY'
set -g @kanagawa-show-location true
set -g @kanagawa-day-month true

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# #############################################################
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Note that on my mac, I am mapping Caps Lock to Control and C-h/j/k/l to arrow keys using Karabiner-Elements
# That is why I am binding arrow keys to pane switching

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# End of Smart pane switching
# #############################################################

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
